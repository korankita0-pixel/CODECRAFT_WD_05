
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | ConnectSphere</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .register-wrap {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 30px 18px;
            background:
                radial-gradient(ellipse at top left, #e8e1ff, transparent 45%),
                var(--bg);
        }

        .register-card {
            width: 100%;
            max-width: 470px;
            padding: 35px;
            border: 1px solid var(--border);
            border-radius: 22px;
            background: var(--surface);
            box-shadow: 0 20px 70px #34256b12;
        }

        .register-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            font-size: 20px;
            font-weight: 800;
        }

        .register-card h1 {
            text-align: center;
            font-size: 28px;
            letter-spacing: -1px;
        }

        .register-subtitle {
            margin: 9px 0 25px;
            text-align: center;
            color: var(--muted);
            line-height: 1.7;
            font-size: 13px;
        }

        .register-group {
            margin-bottom: 16px;
        }

        .register-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 12px;
            font-weight: 700;
        }

        .register-group input {
            width: 100%;
            height: 45px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
            background: var(--bg);
            color: var(--text);
        }

        .register-group input:focus {
            border-color: var(--primary);
        }

        .register-submit {
            width: 100%;
            height: 47px;
            margin-top: 6px;
            border: 0;
            border-radius: 10px;
            color: white;
            background: linear-gradient(135deg, #8b6bfa, #694be8);
            font-weight: 700;
            cursor: pointer;
        }

        .register-message {
            margin-top: 13px;
            font-size: 12px;
            line-height: 1.6;
        }

        .register-switch {
            margin-top: 22px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .register-switch a, .register-home {
            color: var(--primary);
            font-weight: 700;
        }

        .register-home {
            display: block;
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
    <main class="register-wrap">
        <section class="register-card">
            <a href="/" class="register-brand">
                <span class="brand-icon">C</span>
                <span>Connect<span class="brand-accent">Sphere</span></span>
            </a>

            <h1>Create your account ✨</h1>
            <p class="register-subtitle">
                Join the community and start sharing your story.
            </p>

            <form id="registerForm">
                <div class="register-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name"
                           placeholder="Your full name" autocomplete="name"
                           minlength="2" maxlength="50" required>
                </div>

                <div class="register-group">
                    <label for="regEmail">Email address</label>
                    <input type="email" id="regEmail" name="email"
                           placeholder="you@example.com" autocomplete="email" required>
                </div>

                <div class="register-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username"
                           placeholder="Choose a username" autocomplete="username"
                           pattern="[A-Za-z0-9_]{3,20}"
                           title="Use 3–20 letters, numbers, or underscores." required>
                </div>

                <div class="register-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" name="password"
                           placeholder="At least 8 characters"
                           autocomplete="new-password" minlength="8" required>
                </div>

                <div class="register-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                           placeholder="Enter your password again"
                           autocomplete="new-password" minlength="8" required>
                </div>

                <button class="register-submit" type="submit">Create Account →</button>
                <p class="register-message" id="registerMessage" role="status"></p>
            </form>

            <p class="register-switch">
                Already have an account? <a href="/login.html">Sign in</a>
            </p>

            <a href="/" class="register-home">← Back to home</a>
        </section>
    </main>

    <script>
        document.getElementById("registerForm").addEventListener("submit", (event) => {
            event.preventDefault();

            const password = document.getElementById("regPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const message = document.getElementById("registerMessage");

            if (password !== confirmPassword) {
                message.style.color = "#dc2626";
                message.textContent = "Passwords do not match. Please try again.";
                return;
            }

            message.style.color = "#d97706";
            message.textContent = "Registration backend will be connected in the next step.";
        });
    </script>
</body>
</html>
